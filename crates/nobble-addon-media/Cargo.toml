[package]
name = "nobble-addon-media"
description = "Transport control through the Windows media session, as a Nobble addon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The whole point of this crate: **one dependency, and it is the SDK.** T073
# asserts that mechanically. An official addon that reached into `nobble-core`
# would be using an interface a third party cannot, and SC-018 would be a claim
# rather than a fact.
[dependencies]
nobble-addon-sdk = { path = "../nobble-addon-sdk" }

# The `windows` crate rather than `windows-sys`. The media session API is WinRT,
# not Win32: COM objects with reference counting and `IAsyncOperation` returns,
# and hand-rolling that against the raw bindings would be far more unsafe code
# than using the projection.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Media_Control", "Foundation", "Foundation_Collections"]

# Cannot forbid unsafe: it talks to the platform. Confining that to the crates
# that must is the point — and now the confinement is a process boundary too.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
